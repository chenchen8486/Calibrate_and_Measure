# ============================================================================
# Calibrate_and_Measure 全工程配置文件
#
# 本工程包含三大功能，与下面各段的对应关系：
#   功能 1 制板    —— [checkerboard] 生成棋盘格标定板图像
#   功能 2 标定    —— [calibrate] 求解相机内参/畸变并输出标定文件
#   功能 3 测量    —— [rectify] 几何矫正开关，[paths] 输入输出路径，
#                     [segmentation] 分割方式选择，[ai_seg]/[trad_seg] 两种分割实现，
#                     [refine] 边缘亚像素精修，[rotate] 角度校正，[measure] 边缘测量，
#                     [code_detect] 码区（二维码/一维码）外接矩形定位
#   通用           —— [debug] 中间结果（QA 质检图/调试图）落盘总开关
#
# 约定：
#   1. 本文件按 utf-8 编码保存（可带 BOM，解析器会自动跳过）；
#   2. 支持 # 与 ; 行注释及行尾注释，键值两侧空白自动修剪；
#   3. 所有相对路径相对"本 ini 文件所在目录"解析；
#   4. 段间联动：[calibrate] 的内角点/标称格距缺省跟随 [checkerboard]，
#      [rectify] 的标定文件/正射刻度缺省跟随 [calibrate]。被注释掉的联动键
#      保持缺省即可，只有与跟随值不同（如打印后实测格距）才需显式放开配置。
# ============================================================================

# ----------------------------------------------------------------------------
# 功能 1：制板 —— 棋盘格标定板生成参数
# ----------------------------------------------------------------------------
[checkerboard]
square_mm  = 15.0               ; 单格边长（毫米），决定打印后的物理尺寸
cols       = 35                 ; 横向格数（列数）
rows       = 28                 ; 纵向格数（行数）
border_mm  = 15.0               ; 棋盘四周留白边距（毫米），防止角点提取受纸边干扰
paper_w_mm = 555.0              ; 纸张宽度（毫米）,和硬件放置面板尺寸绑定，比硬件轻微内缩一点点，确保纸张放置留有余量
paper_h_mm = 450.0              ; 纸张高度（毫米），同上
out_dir    = assets/checkerboard ; 标定板图像输出目录（相对 ini 目录）

# ----------------------------------------------------------------------------
# 功能 2：标定 —— 相机标定求解参数
# ----------------------------------------------------------------------------
[calibrate]
input_dir    = assets/test_data/calibration ; 标定采图目录（相对 ini 目录，多张时自动取角点均值降噪）
out_xml      = assets/calibration/checkerboard_calib.xml ; 标定结果输出文件（相对 ini 目录）
target_mm_per_px = 0.15            ; 标定后期望的像素当量（毫米/像素），用于 QA 评估
qa_dir       = temp/calibration_qa ; 标定质量检查图像输出目录（相对 ini 目录）

# ----------------------------------------------------------------------------
# 功能 3 之 0)：几何矫正 —— 畸变矫正开关
# ----------------------------------------------------------------------------
[rectify]
enabled    = false              ; 是否启用畸变矫正（true/false；标定未完成时保持 false）

# ----------------------------------------------------------------------------
# 功能 3：通用路径
# ----------------------------------------------------------------------------
[paths]
input_dir       = assets/test_data/input     ; 待测图像输入目录（相对 ini 目录）
output_dir      = assets/test_data/output    ; 测量结果输出目录（相对 ini 目录）
background_file = temp/background_model.bmp  ; 背景建模参考图缓存（相对 ini 目录，功能性缓存，不受 [debug] 开关控制）

# ----------------------------------------------------------------------------
# 功能 3 之 1)：分割方式选择
# ----------------------------------------------------------------------------
[segmentation]
method = ai                     ; 分割方法：ai = ONNX 模型分割；traditional = 传统背景差分

# ----------------------------------------------------------------------------
# 功能 3：AI 分割参数（ONNX Runtime 推理，method = ai 时生效）
# ----------------------------------------------------------------------------
[ai_seg]
onnx_model   = assets/weights/small.onnx ; ONNX 模型文件（相对 ini 目录）
threshold    = 0.3              ; 前景概率阈值（0~1），越低召回越高
expand_ratio = 0.08             ; 掩码外扩比例（相对目标尺寸），保证边缘完整保留
refine       = true             ; 是否在 AI 掩码基础上做形态学精修（true/false）
device       = auto               ; 推理设备：auto = 检测到可用 CUDA 12 环境才启用 GPU，
                                  ; 否则自动回退 CPU（无报错噪音，推荐）；
                                  ; cuda = 强制 GPU（环境异常时回退 CPU 并记警告）；cpu = 强制 CPU

# ----------------------------------------------------------------------------
# 功能 3：传统背景差分分割参数（method = traditional 时生效）
# ----------------------------------------------------------------------------
[trad_seg]
bilateral_d       = 21          ; 双边滤波邻域直径（像素）
sigma_color       = 15.0        ; 双边滤波颜色域标准差
sigma_space       = 15.0        ; 双边滤波空间域标准差
gamma             = 0.5         ; 伽马校正指数（<1 提亮暗部差异）
diff_floor        = 7.0         ; 差分下限（灰度级），低于该值视为背景噪声
diff_ceiling      = 25.0        ; 差分上限（灰度级），达到该值视为确定前景
morph_open_kernel = 5           ; 开运算核尺寸（像素），去除细小噪点
morph_close_kernel = 61         ; 闭运算核尺寸（像素），填补前景内部空洞
min_area_ratio    = 0.005       ; 有效前景最小面积占比（相对整幅图像）

# ----------------------------------------------------------------------------
# 功能 3 之 2)：边缘精修 —— 亚像素轮廓提取参数
# ----------------------------------------------------------------------------
[refine]
step_window        = 10.0       ; 阶跃边缘拟合窗口半宽（像素）
sample_step        = 6          ; 轮廓采样间隔（像素）
search_radius      = 25.0       ; 法向搜索半径（像素）
profile_step       = 0.5        ; 灰度剖面采样步长（像素）
gradient_threshold = 6.0        ; 有效边缘最小梯度幅值（灰度级/像素）
peak_ratio         = 0.35       ; 次峰相对主峰的最小比值，用于剔除伪边缘
outlier_tol        = 3.0        ; 离群点剔除容差（像素）
median_window      = 9          ; 中值平滑窗口长度（采样点个数，取奇数）

# ----------------------------------------------------------------------------
# 功能 3 之 3)：角度校正参数
# ----------------------------------------------------------------------------
[rotate]
approx_epsilon_ratio = 0.004    ; 多边形逼近系数（相对轮廓周长）
edge_band            = 8        ; 边缘带宽度（像素），用于提取直线段附近的轮廓点

# ----------------------------------------------------------------------------
# 功能 3 之 4)：边缘测量参数
# ----------------------------------------------------------------------------
[measure]
extreme_band         = 5.0      ; 极值判定带宽（像素）
refine_rows          = 15       ; 精修参与行数
ransac_threshold     = 2.0      ; RANSAC 直线拟合内点阈值（像素）
edge_width_threshold = 300.0    ; 边缘条最大宽度（像素），超过则判为异常
angle_tol_deg        = 3.0      ; 共线判定角度容差（度）
tangent_span         = 5        ; 切线方向估计的邻域点数
line_dist_tol        = 7.0      ; 点到直线距离容差（像素）
span_gap_tol         = 15.0     ; 跨度间隙容差（像素）
merge_gap_pts        = 10       ; 边缘段合并允许的最大断点间隔（点数）
ranked_region_ratio  = 0.5      ; 有效排名区域比例（相对边缘总长）

# ----------------------------------------------------------------------------
# 功能 3 之 5)：码区检测 —— 产品表面二维码/一维码外接矩形定位
# ----------------------------------------------------------------------------
[code_detect]
enabled      = true             ; 码区检测开关（false 时结果中的 codeRegions 恒为空）
max_side     = 0                ; 检测降采样上限（像素最长边），0 = 全分辨率。
                                ; 条码条纹对降采样敏感（5.5K 图实测 0.5 倍以下检出率
                                ; 明显下跌），默认全分辨率最稳；高分辨率相机确认检出率
                                ; 后可调小加速。框坐标自动映射回原图尺度
min_area_px  = 900              ; 码框最小面积（原图尺度像素²，约 30x30），过滤噪点候选

# ----------------------------------------------------------------------------
# 通用：中间结果落盘开关（调试用，部署时可关闭以减少磁盘占用）
# ----------------------------------------------------------------------------
[debug]
save_intermediate = true        ; true  = 保存中间结果：标定 QA 质检图（[calibrate] qa_dir）、
                                ;         每张测量图的分割掩膜/增强图/旋转图/测量叠加图
                                ;         （输出到 [paths] output_dir/debug/图像名/ 下）；
                                ; false = 部署模式，只输出最终结果（标定 XML、测量 CSV），
                                ;         不落任何过程图。
                                ; 注意：背景模型缓存 [paths] background_file 是功能性缓存，
                                ;       不受本开关控制。
